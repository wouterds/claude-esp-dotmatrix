; Waveshare ESP32-S3-Matrix - ESP32-S3FH4R2 with an 8x8 WS2812 matrix on GPIO14.
; There is no PlatformIO board definition for it, so this is the generic S3
; devkit narrowed to the flash this module actually carries.
[env:esp32-s3-matrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The module is an ESP32-S3FH4R2 - 4MB of flash where the generic devkit
; profile assumes 8MB. Only board_build reaches the app; without the upload
; entries the second stage bootloader is still built with an 8MB header, the
; flash probe fails against the real chip and it never reaches the sketch. That
; failure is silent unless something is reading the port at boot.
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; The S3 talks over its built-in USB-Serial-JTAG rather than a UART bridge, and
; CDC_ON_BOOT is what points `Serial` at it. Left at the devkit default of 0,
; `Serial` goes to the UART pins instead and the board looks mute over USB while
; running perfectly well.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMATRIX_PIN=14

lib_deps = adafruit/Adafruit NeoPixel@^1.15.1

monitor_speed = 115200
